<style>

);background:var(--panel2);color:var(--ink);padding:9px 11px;border-radius:8px;font-weight:750;cursor:pointer}.btn:hover{border-color:color-mix(in srgb,var(--accent) 65%,var(--line))}.btn.primary{background:var(--accent);border-color:var(--accent);color:#17110a}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.good{background:var(--ok);border-color:var(--ok);color:#08130c}.btn.ghost{background:transparent}.bigaction{font-size:18px;padding:15px 18px}.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);padding:3px 7px;border-radius:999px;font-size:11px;font-weight:800}.badge.ok{color:var(--ok)}.badge.watch{color:var(--watch)}.badge.danger{color:var(--danger)}.badge.info{color:var(--info)}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px}textarea{min-height:80px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.formgrid .full{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{position:sticky;top:0;background:var(--panel2);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}tr:last-child td{border-bottom:0}.list{display:grid;gap:8px}.item{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}.item.selected{outline:2px solid var(--accent)}.priority-high{border-left:4px solid var(--danger)}.priority-medium{border-left:4px solid var(--watch)}.priority-low{border-left:4px solid var(--info)}.mapShell{position:relative;min-height:560px;background:var(--map);border:1px solid var(--line);border-radius:10px;overflow: er-radius:7px}.notice{border-left:4px solid var(--info);padding:10px 12px;background:color-mix(in srgb,var(--info) 10%,var(--panel));border-radius:6px}.dangerNotice{border-left-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--panel))}.panorama{height:270px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(#6c7880 0 38%,#363e33 39% 56%,#1e271b 57%);position:relative;overflow:hidden}.panorama img{width:100%;height:100%;object-fit:cover}.panoCursor{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--danger)}.panoBearing{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:4px 8px;border-radius:999px;font-weight:800}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.tabs button{font-size:12px}.tabpane{display:none}.tabpane.active{display:block}.footerNote{padding:18px 0;color:var(--muted);font-size:11px;text-align:center}.kpiStrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.kpi{padding:10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}.kpi .v{font-size:20px;font-weight:850}.startup{display:none;position:fixed;inset:0;background:#f8faf7;color:#182019;z-index:9999;padding:30px}.startup.show{display:block}
@media(max-width:1000px){.split,.g3,.g4{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.kpiStrip{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.main{padding:8px}.formgrid{grid-template-columns:1fr}.kpiStrip{grid-template-columns:repeat(2,1fr)}.brandrow{padding:8px}.mapShell{min-height:470px}.modalBackdrop{padding:6px}.modal{padding:12px}.timeline .event{grid-template-columns:64px 1fr}}

const TYPE_CODE={OBS:1,UPDATE:2,BEARING:3,ACK:4,CLEAR:5,REQUEST:6,STATUS:7},OBS_CODE={UNKNOWN:0,SMOKE:1,FIRE:2,FLAME:3,LIGHTNING:4,'PRESCRIBED BURN':5,'STRUCTURE FIRE':6,'FALSE ALARM':7,CLEAR:8,OTHER:9},CONF_CODE={UNKNOWN:0,LOW:1,MODERATE:2,HIGH:3,CONFIRMED:4},URG_CODE={ROUTINE:0,IMPORTANT:1,EMERGENCY:2};const rev=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k])),TR=rev(TYPE_CODE),OR=rev(OBS_CODE),CR=rev(CONF_CODE),UR=rev(URG_CODE);

function decodeFWP(bytes){if(bytes.length<27)throw new Error('FWP/1 must be 27 bytes');const v=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);let o=0,version=v.getUint8(o++),messageType=TR[v.getUint8(o++)]||'OBS',reportId=[v.getUint8(o++),v.getUint8(o++),v.getUint8(o++)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase(),revision=v.getUint8(o++),timestamp=new Date(v.getUint32(o,false)*1000).toISOString();o+=4;const targetLat=v.getInt32(o,false)/1e7;o+=4;const targetLon=v.getInt32(o,false)/1e7;o+=4;const bearingDeg=v.getUint16(o,false)/10;o+=2;const rangeM=v.getUint16(o,false);o+=2;return{version,messageType,reportId,revision,timestamp,targetLat,targetLon,bearingDeg,rangeM,eventType:OR[v.getUint8(o++)]||'UNKNOWN',confidence:CR[v.getUint8(o++)]||'UNKNOWN',urgency:UR[v.getUint8(o++)]||'ROUTINE',flags:v.getUint16(o,false)}}

function renderAll(){document.documentElement.dataset.theme=state.settings.theme==='light'?'light':'';$('#roleBadge').textContent=state.settings.role||'LOOKOUT';renderView(state.settings.view||'watch')}function renderView(v){if(v==='watch')renderWatch();if(v==='map')renderMap();if(v==='incidents')renderIncidents();if(v==='log')renderLog();if(v==='tower')renderTower();if(v==='network')renderNetwork()}
function ascii(s){return String(s).normalize('NFKD').replace(/°/g,' deg').replace(/±/g,'+/-').replace(/[–—]/g,'-').replace(/[^\x20-\x7E\n]/g,'?')} function pdfEsc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')} function wrapLine(line,width=90){if(line.length<=width)return[line];let out=[],r=line;while(r.length>width){let c=r.lastIndexOf(' ',width);if(c<20)c=width;out.push(r.slice(0,c));r=r.slice(c).trimStart()}if(r)out.push(r);return out}
function pdfBlob(title,text){const raw=[title,'',...text.split('\n')].flatMap(x=>wrapLine(ascii(x))),pp=52,pages=[];for(let i=0;i<raw.length;i+=pp)pages.push(raw.slice(i,i+pp));if(!pages.length)pages.push([]);const ob=[],font=3,ps=4,cs=ps+pages.length;ob[1]='<< /Type /Catalog /Pages 2 0 R >>';ob[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>`${ps+i} 0 R`).join(' ')}] /Count ${pages.length} >>`;ob[font]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';pages.forEach((lines,i)=>{const po=ps+i,co=cs+i;ob[po]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${co} 0 R >>`;let y=752,cmd=['BT','/F1 10 Tf'];for(const l of lines){cmd.push(`1 0 0 1 42 ${y} Tm (${pdfEsc(l)}) Tj`);y-=13}cmd.push('ET');const st=cmd.join('\n');ob[co]=`<< /Length ${st.length} >>\nstream\n${st}\nendstream`});let pdf='%PDF-1.4\n',offs=[0],count=cs+pages.length-1;for(let i=1;i<=count;i++){offs[i]=pdf.length;pdf+=`${i} 0 obj\n${ob[i]}\nendobj\n`}const xr=pdf.length;pdf+=`xref\n0 ${count+1}\n0000000000 65535 f \n`;for(let i=1;i<=count;i++)pdf+=`${String(offs[i]).padStart(10,'0')} 00000 n \n`;pdf+=`trailer\n<< /Size ${count+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;return new Blob([pdf],{type:'application/pdf'})}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function downloadIncidentPdf(i){const bs=state.bearings.filter(b=>b.incidentId===i.id),obs=state.observations.filter(o=>o.incidentId===i.id),logs=state.logs.filter(l=>l.incidentId===i.id),text=[`Report: ${i.reportId}`,`Status: ${i.status}`,`Location: ${i.targetLat||'—'}, ${i.targetLon||'—'} (${i.locationMethod||'UNKNOWN'}, +/-${Math.round(i.uncertaintyM||0)} m)`,`Geometry: ${i.geometryQuality||'—'} RMS ${Number(i.rmsResidualDeg||0).toFixed(2)} deg`,'','OBSERVATIONS',...obs.map(o=>`${fmt(o.createdAt)} ${o.type} ${o.bearingDeg.toFixed(1)} deg ${o.confidence} ${o.notes||''}`),'','BEARINGS',...bs.map(b=>`${state.towers.find(t=>t.id===b.towerId)?.name||b.towerId}: ${b.bearingDeg.toFixed(1)} deg +/-${b.uncertaintyDeg}`),'','TIMELINE',...logs.map(l=>`${fmt(l.timestamp)} ${l.kind}: ${l.message}`)].join('\n');download(pdfBlob(`FIREWATCH Incident ${i.reportId}`,text),`FIREWATCH-Incident-${i.reportId}.pdf`)}
function downloadShiftPdf(){const wx=latestWeather(),active=state.incidents.filter(i=>i.status!=='CLOSED'),text=[`Tower: ${tower().name}`,`Operator: ${state.shift.operatorName}`,`Shift started: ${fmt(state.shift.startedAt)}`,`Latest weather: ${wx?`${wx.temperatureF} F, RH ${wx.rh}%, wind ${wx.windDir} ${wx.windMph} mph, visibility ${wx.visibilityMi} mi (${wx.source})`:'none'}`,'',`ACTIVE INCIDENTS: ${active.length}`,...active.map(i=>`${i.reportId} ${i.title} ${i.status}`),'',`OPEN RECHECKS: ${state.watchItems.filter(w=>w.status==='OPEN').length}`,...state.watchItems.filter(w=>w.status==='OPEN').map(w=>`${w.priority} ${w.title}: ${w.reason}`),'','HANDOFF',state.shift.handoffNotes||'','',...state.logs.slice(0,80).reverse().map(l=>`${fmt(l.timestamp)} ${l.kind}: ${l.message}`)].join('\n');download(pdfBlob('FIREWATCH Shift / Handoff Report',text),`FIREWATCH-Shift-${new Date().toISOString().slice(0,10)}.pdf`)}
$$('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#themeBtn').onclick=()=>{state.settings.theme=state.settings.theme==='light'?'dark':'light';save();renderAll()};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key.toLowerCase()==='n')openSighting();if(e.key.toLowerCase()==='m')setView('map');if(e.key.toLowerCase()==='l')setView('log');if(e.key==='Escape')closeModal()});
setView(state.settings.view||'watch');
}catch(err){document.getElementById('startup').classList.add('show');document.getElementById('startupMsg').textContent='FIREWATCH could not start. Your browser storage has not been intentionally cleared.';document.getElementById('startupDetail').textContent=err&&err.stack?err.stack:String(err);console.error(err)}
})();
