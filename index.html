<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1512" />
    <meta name="description" content="FIREWATCH — Distributed Wildfire Observation & Lookout Operations System" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>FIREWATCH</title>
    <style>
      html,body,#root{min-height:100%;margin:0}
      body{background:#0d1512;color:#e8eee9;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #boot-fallback{box-sizing:border-box;min-height:100vh;display:grid;place-items:center;padding:32px;background:#0d1512}
      #boot-fallback .boot-card{width:min(680px,100%);border:1px solid #314038;background:#111c17;padding:28px;border-radius:12px;box-shadow:0 20px 70px rgba(0,0,0,.28)}
      #boot-fallback strong{display:block;font-size:28px;letter-spacing:.08em}
      #boot-fallback span{display:block;margin-top:8px;color:#9eb0a5}
      #boot-fallback pre{display:none;margin-top:18px;padding:14px;overflow:auto;white-space:pre-wrap;background:#08100c;border:1px solid #314038;color:#ffcf9b}
      #boot-fallback[data-failed="true"] pre{display:block}
      #boot-fallback[data-failed="true"] .starting{display:none}
      #boot-fallback .hint{display:none;margin-top:14px;line-height:1.45;color:#c6d2ca}
      #boot-fallback[data-failed="true"] .hint{display:block}
    </style>
    <script>
      window.__FIREWATCH_BOOTED__ = false;
      window.__FIREWATCH_BOOT_ERROR__ = '';
      function firewatchBootFailure(message) {
        window.__FIREWATCH_BOOT_ERROR__ = String(message || 'Unknown startup failure');
        var el = document.getElementById('boot-fallback');
        if (!el) return;
        el.setAttribute('data-failed', 'true');
        var out = el.querySelector('pre');
        if (out) out.textContent = window.__FIREWATCH_BOOT_ERROR__;
      }
      window.addEventListener('error', function (event) { firewatchBootFailure(event.message || 'JavaScript failed to load.'); });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        firewatchBootFailure(reason && reason.message ? reason.message : String(reason || 'Unhandled startup rejection'));
      });
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (!window.__FIREWATCH_BOOTED__ && document.getElementById('boot-fallback')) {
            firewatchBootFailure(window.__FIREWATCH_BOOT_ERROR__ || 'FIREWATCH did not start. If this directory was uploaded directly from the source ZIP, build it first with npm install && npm run build, then deploy the contents of dist/.');
          }
        }, 2500);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div class="boot-card">
          <strong>FIREWATCH</strong>
          <span class="starting">Starting local station…</span>
          <pre></pre>
          <div class="hint">The local browser database has not been cleared. A source checkout is not directly deployable as static HTML; use the compiled <code>dist/</code> output. FIREWATCH v1.0.1 also supports deployment from a subfolder.</div>
        </div>
      </div>
    </div>
    <noscript>FIREWATCH requires JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
