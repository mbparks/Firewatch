function renderIncidents(){const incs=state.incidents.slice().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)),sel=incident();$('#view-incidents').innerHTML=`<div class="row-between"><div><div class="eyebrow">Evidence and lifecycle</div><h1>INCIDENTS</h1></div><button class="btn" id="promoteObs">PROMOTE UNASSIGNED SIGHTING</button></div><div class="split"><div class="card"><h2>Incident board</h2><div class="list">${incs.map(i=>`<div class="item ${i.id===sel?.id?'selected':''}" data-selectinc="${i.id}"><div class="row-between"><strong>${esc(i.title)}</strong>${badge(i.status)}</div><div class="small muted">${i.reportId} · ${i.locationMethod||'UNKNOWN'} · ${i.targetLat?.toFixed(5)??'—'}, ${i.targetLon?.toFixed(5)??'—'}</div></div>`).join('')||'<div class="muted">No incidents yet.</div>'}</div></div><div>${sel?incidentDetail(sel):'<div class="card">Select or create an incident.</div>'}</div></div>`;$$('[data-selectinc]').forEach(x=>x.onclick=()=>{state.settings.selectedIncidentId=x.dataset.selectinc;save();renderIncidents()});$('#promoteObs').onclick=promoteObservation;const add=$('#addRemoteBearing');if(add)add.onclick=()=>openBearing(sel);const st=$('#incStatus');if(st)st.onchange=()=>{sel.status=st.value;sel.updatedAt=now();log('INCIDENT',`${sel.title} status → ${sel.status}`,sel.id);save();renderAll()};const report=$('#incReport');if(report)report.onclick=()=>downloadIncidentPdf(sel)}
function incidentEnvironmentRows(i){const obs=state.observations.filter(o=>o.incidentId===i.id||o.reportId===i.reportId),logs=state.logs.filter(l=>l.incidentId===i.id),items=[];for(const o of obs){const w=nearestWeather(o.createdAt);items.push({timestamp:o.createdAt,label:`${o.type} · ${o.bearingDeg.toFixed(1)}°`,kind:'OBSERVATION',weather:w,detail:o.notes||''})}for(const l of logs){if(!items.some(x=>x.timestamp===l.timestamp&&x.label===l.message))items.push({timestamp:l.timestamp,label:l.message,kind:l.kind,weather:nearestWeather(l.timestamp),detail:''})}return items.sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp))}
function incidentDetail(i){const bs=state.bearings.filter(b=>b.incidentId===i.id),obs=state.observations.filter(o=>o.incidentId===i.id),tri=triangulate(bs,state.towers),env=incidentEnvironmentRows(i),firstWx=env.find(x=>x.weather)?.weather,lastWx=[...env].reverse().find(x=>x.weather)?.weather;const wxDelta=firstWx&&lastWx&&firstWx.id!==lastWx.id?{temp:(+lastWx.temperatureF)-(+firstWx.temperatureF),rh:(+lastWx.rh)-(+firstWx.rh),wind:(+lastWx.windMph)-(+firstWx.windMph)}:null;return `<div class="card"><div class="row-between"><div><div class="eyebrow">${i.reportId}</div><h2>${esc(i.title)}</h2></div>${badge(i.urgency)}</div><div class="formgrid"><div class="field"><label>Status</label><select id="incStatus">${['SIGHTING','SUSPECTED','REPORTED','CONFIRMED','RESPONDING','MONITORING','CLOSED'].map(x=>`<option ${i.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div><div class="eyebrow">Location</div><strong>${i.targetLat?.toFixed(6)??'—'}, ${i.targetLon?.toFixed(6)??'—'}</strong><div class="small muted">${i.locationMethod||'UNKNOWN'} · ±${Math.round(i.uncertaintyM||0)} m</div></div></div><div class="kpiStrip" style="margin-top:10px;grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="eyebrow">Geometry</div><div class="v">${i.geometryQuality||'—'}</div></div><div class="kpi"><div class="eyebrow">RMS</div><div class="v">${Number(i.rmsResidualDeg||0).toFixed(2)}°</div></div><div class="kpi"><div class="eyebrow">Bearings</div><div class="v">${bs.length}</div></div></div><div class="row" style="margin:10px 0"><button class="btn" id="addRemoteBearing">ADD / SEND BEARING</button><button class="btn" id="incReport">EXPORT PDF</button></div><h3>Bearing evidence</h3><div class="tablewrap"><table><thead><tr><th>Tower</th><th>Measured</th><th>±</th><th>Residual</th><th>Flag</th></tr></thead><tbody>${bs.map(b=>{const t=state.towers.find(t=>t.id===b.towerId),r=tri?.residuals.find(r=>r.towerId===b.towerId&&Math.abs(r.measured-b.bearingDeg)<.001);return`<tr><td>${esc(t?.name||b.towerId)}</td><td>${b.bearingDeg.toFixed(1)}°</td><td>${b.uncertaintyDeg}°</td><td>${r?r.residualDeg.toFixed(2)+'°':'—'}</td><td>${r?.outlier?badge('OUTLIER'):badge('OK')}</td></tr>`}).join('')}</tbody></table></div><h3 style="margin-top:12px">Observations</h3><div class="list">${obs.map(o=>`<div class="item"><div class="row-between"><strong>${esc(o.type)}</strong>${badge(o.confidence)}</div><div class="small muted">${fmt(o.createdAt)} · ${o.bearingDeg.toFixed(1)}°</div><div>${esc(o.notes||'')}</div></div>`).join('')}</div><h3 style="margin-top:12px">Observation + weather timeline</h3>${wxDelta?`<div class="notice"><strong>Conditions changed during recorded incident evidence</strong><br><span class="small">Temperature ${Number.isFinite(wxDelta.temp)?`${wxDelta.temp>=0?'+':''}${wxDelta.temp.toFixed(1)}°F`:'—'} · RH ${Number.isFinite(wxDelta.rh)?`${wxDelta.rh>=0?'+':''}${wxDelta.rh.toFixed(0)}%`:'—'} · wind ${Number.isFinite(wxDelta.wind)?`${wxDelta.wind>=0?'+':''}${wxDelta.wind.toFixed(0)} mph`:'—'}</span></div>`:''}<div class="miniTimeline" style="margin-top:8px">${env.map(e=>`<div class="tick"><div class="small muted">${fmt(e.timestamp)}</div><div><strong>${esc(e.label)}</strong>${e.detail?`<div class="small">${esc(e.detail)}</div>`:''}${e.weather?`<div class="small muted">WX ${e.weather.temperatureF??'—'}°F · RH ${e.weather.rh??'—'}% · ${esc(e.weather.windDir||'')} ${e.weather.windMph??'—'} mph · vis ${e.weather.visibilityMi??'—'} mi · ${esc(e.weather.source||'')}</div>`:'<div class="small muted">No weather observation within 3 hours</div>'}</div></div>`).join('')||'<div class="muted">No incident timeline evidence yet.</div>'}</div></div>`}
function promoteObservation(){const o=state.observations.find(o=>!o.incidentId);if(!o){alert('No unassigned sightings.');return}const i={id:uid('inc'),reportId:o.reportId,title:`${o.type} ${o.bearingDeg.toFixed(1)}°`,status:'SUSPECTED',createdAt:o.createdAt,updatedAt:now(),targetLat:o.targetLat,targetLon:o.targetLon,uncertaintyM:o.rangeUncertaintyM||1000,locationMethod:o.targetMethod,confidence:o.confidence,urgency:o.urgency,observationIds:[o.id],bearingIds:[]};o.incidentId=i.id;state.bearings.filter(b=>b.reportId===o.reportId).forEach(b=>{b.incidentId=i.id;i.bearingIds.push(b.id)});state.incidents.push(i);state.settings.selectedIncidentId=i.id;log('INCIDENT',`Created incident ${i.reportId}`,i.id);save();renderAll()}
function openBearing(i){modal('Add bearing evidence',`<div class="formgrid"><div class="field"><label>Tower</label><select id="bTower">${state.towers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Bearing °</label><input id="bDeg" type="number" step=".1"></div><div class="field"><label>Uncertainty ±°</label><input id="bUnc" type="number" step=".1" value="0.5"></div><div class="field"><label>Transport</label><select id="bTransport"><option>LOCAL</option><option>MESHTASTIC</option><option>RADIO</option></select></div></div><div class="row" style="margin-top:12px"><button class="btn primary" id="bSave">SAVE</button><button class="btn" id="bFwp">SAVE + SIMULATE FWP</button></div>`,()=>{const doSave=(send)=>{const b={id:uid('bear'),reportId:i.reportId,incidentId:i.id,towerId:$('#bTower').value,bearingDeg:+$('#bDeg').value,uncertaintyDeg:+$('#bUnc').value||.5,createdAt:now(),source:$('#bTransport').value};if(!isFinite(b.bearingDeg)){alert('Bearing required');return}state.bearings.push(b);i.bearingIds=Array.from(new Set([...(i.bearingIds||[]),b.id]));retriangulate(i);if(send)simulateFwp('BEARING',i,b);log('BEARING',`Bearing ${b.bearingDeg.toFixed(1)}° received for ${i.reportId}`,i.id);save();closeModal();renderAll()};$('#bSave').onclick=()=>doSave(false);$('#bFwp').onclick=()=>doSave(true)})}
function renderLog(){const logs=state.logs.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));$('#view-log').innerHTML=`<div class="row-between"><div><div class="eyebrow">Automatic chronology</div><h1>LOG</h1></div><div class="row"><button class="btn" id="manualLog">ADD NOTE</button><button class="btn" id="radioLog">LOG RADIO</button><button class="btn" id="shiftPdf">SHIFT PDF</button></div></div><div class="card"><div class="timeline">${logs.map(l=>`<div class="event"><div class="small muted">${time(l.timestamp)}</div><div><strong>${esc(l.kind)}</strong><div>${esc(l.message)}</div><div class="small muted">${new Date(l.timestamp).toLocaleDateString()}</div></div></div>`).join('')}</div></div>`;$('#manualLog').onclick=()=>simpleNote('Manual log entry','NOTE');$('#radioLog').onclick=()=>simpleNote('Radio log','RADIO');$('#shiftPdf').onclick=downloadShiftPdf}

ctive'));$('#tower-'+b.dataset.tab).classList.add('active')});bindStationPane();bindMapDataPane();bindWeatherPane();$('#backupBtn').onclick=backup;$('#importBackupBtn').onclick=()=>$('#backupFile').click();$('#backupFile').onchange=restore;$('#freshBtn').onclick=startFresh;$('#newStationTowerBtn').onclick=newStationWizard;$$('[data-eq]').forEach(x=>x.onchange=()=>{const e=state.equipment.find(e=>e.id===x.dataset.eq);e.status=x.value;log('EQUIPMENT',`${e.name} → ${e.status}`);save()});$$('[data-proc]').forEach(x=>x.onclick=()=>runProcedure(x.dataset.proc));bindHorizonPane();bindBatch8Tower()}
function weatherPane(wx){const hist=state.weather.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).slice(0,12),trend=weatherTrend(3),vis=state.visibilityObservations.slice().sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).slice(0,6),lm=state.landmarks.slice().map(l=>({...l,distanceM:haversine(tower(),l)})).sort((a,b)=>a.distanceM-b.distanceM);return `<div class="grid g2"><div><div class="card"><div class="row-between"><h2>Weather Desk</h2>${badge(wx.source||'NO DATA')}</div><div class="kpiStrip" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="eyebrow">Temp</div><div class="v">${wx.temperatureF??'—'}°F</div></div><div class="kpi"><div class="eyebrow">RH</div><div class="v">${wx.rh??'—'}%</div></div><div class="kpi"><div class="eyebrow">Wind</div><div class="v">${wx.windDir||'—'} ${wx.windMph??'—'}</div></div></div><p class="small muted">${wx.timestamp?fmt(wx.timestamp):''} · provenance: ${esc(wx.sourceName||wx.source||'')}</p>${trend?`<div class="notice"><strong>3-hour change</strong><br><span class="small">Temperature ${trend.temp==null?'—':`${trend.temp>=0?'+':''}${trend.temp.toFixed(1)}°F`} · RH ${trend.rh==null?'—':`${trend.rh>=0?'+':''}${trend.rh.toFixed(0)}%`} · wind ${trend.wind==null?'—':`${trend.wind>=0?'+':''}${trend.wind.toFixed(0)} mph`} · visibility ${trend.vis==null?'—':`${trend.vis>=0?'+':''}${trend.vis.toFixed(1)} mi`}</span></div>`:''}<div class="row" style="margin-top:8px"><button class="btn primary" id="manualWx">MANUAL OBSERVATION</button><button class="btn" id="pollWx">POLL JSON SOURCE</button></div></div><div class="card" style="margin-top:12px"><h2>Visibility by landmark</h2><div class="field"><label>Farthest clearly visible landmark</label><select id="visLandmark"><option value="">Select landmark…</option>${lm.map(l=>`<option value="${l.id}">${esc(l.name)} · ${(l.distanceM/1609.344).toFixed(1)} mi · ${bearingBetween(tower(),l).toFixed(0)}°</option>`).join('')}</select></div><div class="row" style="margin-top:8px"><button class="btn" id="saveVisLandmark">RECORD VISIBILITY</button></div><div class="list" style="margin-top:8px">${vis.map(v=>`<div class="item"><div class="row-between"><strong>${Number(v.visibilityMi).toFixed(1)} mi</strong><span class="small muted">${fmt(v.timestamp)}</span></div><div class="small muted">${esc(v.landmarkName||'Manual landmark')} · ${Number(v.bearingDeg||0).toFixed(0)}°</div></div>`).join('')||'<div class="muted">No landmark visibility checks recorded.</div>'}</div></div></div><div><div class="card"><h2>JSON source</h2><div class="field"><label>URL</label><input id="wxUrl" value="${esc(state.settings.weatherUrl||'')}"></div><div class="small muted" style="margin-top:8px">Expected keys may include temperatureF, rh, windDir, windMph, gustMph, pressureInHg, precipIn, visibilityMi, cloudCover. Optional only; manual weather works offline.</div></div><div class="card" style="margin-top:12px"><h2>Recent observations</h2><div class="tablewrap"><table><thead><tr><th>Time</th><th>Source</th><th>Temp</th><th>RH</th><th>Wind</th><th>Vis</th></tr></thead><tbody>${hist.map(w=>`<tr><td>${time(w.timestamp)}</td><td>${esc(w.source||'—')}</td><td>${w.temperatureF??'—'}°</td><td>${w.rh??'—'}%</td><td>${esc(w.windDir||'')} ${w.windMph??'—'}</td><td>${w.visibilityMi??'—'} mi</td></tr>`).join('')||'<tr><td colspan="6" class="muted">No weather observations.</td></tr>'}</tbody></table></div></div></div></div>`}

function norm360(v){return((+v%360)+360)%360}
function panoFraction(bearing,start=state.panorama.startBearingDeg||0,span=state.panorama.spanDeg||360){const s=norm360(start),b=norm360(bearing),sp=clamp(+span||360,1,360);let d=norm360(b-s);if(sp>=359.9)return d/360;return d<=sp?d/sp:null}

function openMeshBearingResponse(m){if(!m)return;const i=state.incidents.find(x=>x.reportId===m.reportId),t=tower(),b=m.targetLat?bearingBetween(t,{lat:m.targetLat,lon:m.targetLon}):m.bearingDeg;modal('Respond with bearing',`<div class="notice"><strong>${esc(meshNodeLabel(m.fromId))}</strong> requests an independent bearing for <strong>${esc(m.reportId)}</strong>.</div><div class="kpi"><div class="eyebrow">LOOK HERE</div><div class="v">${Number(b||0).toFixed(1)}°</div></div><div class="formgrid" style="margin-top:12px"><div class="field"><label>Measured bearing °</label><input id="mrBearing" type="number" step="0.1" value="${Number(b||0).toFixed(1)}"></div><div class="field"><label>Uncertainty ±°</label><input id="mrUnc" type="number" step="0.1" value="0.5"></div></div><button class="btn primary" id="mrSend" style="margin-top:10px">SEND BEARING</button>`,()=>{$('#mrSend').onclick=()=>{const v=+$('#mrBearing').value,u=Math.max(.1,+$('#mrUnc').value||.5);if(!Number.isFinite(v))return;if(i){const be={id:uid('bear'),reportId:m.reportId,incidentId:i.id,towerId:t.id,bearingDeg:v,uncertaintyDeg:u,createdAt:now(),source:'LOCAL RESPONSE'};state.bearings.push(be);i.bearingIds=Array.from(new Set([...(i.bearingIds||[]),be.id]));retriangulate(i)}queueFwp({messageType:'BEARING',reportId:m.reportId,bearingDeg:v,bearingUncertaintyDeg:u,eventType:'SMOKE',confidence:'HIGH',urgency:m.urgency||'IMPORTANT',targetLat:i?.targetLat||m.targetLat||0,targetLon:i?.targetLon||m.targetLon||0},m.fromId);const w=state.watchItems.find(w=>w.sourceMessageId===m.id);if(w)w.status='CLOSED';save();closeModal();renderAll()}})}
function simulateRemoteRequest(){const i=incident();if(!i){alert('Select an incident first.');return}const e=encodeFWP({messageType:'REQUEST',reportId:i.reportId,bearingDeg:0,rangeM:0,eventType:'SMOKE',confidence:i.confidence,urgency:i.urgency,targetLat:i.targetLat||0,targetLon:i.targetLon||0});receiveFwpEnvelope({payloadHex:e.hex,fromId:'!SIMREMOTE',rxSnr:7.5,rxRssi:-91});save();renderNetwork()}

function openFieldUpdate(){const i=incident();if(!i){alert('No selected incident.');return}modal('Field update',`<div class="field"><label>Incident</label><input value="${esc(i.title)}" disabled></div><div class="field"><label>Update</label><select id="fuType"><option>ON SCENE</option><option>FIRE LOCATED</option><option>NO FIRE FOUND</option><option>CORRECT LOCATION</option><option>STATUS</option></select></div><div class="formgrid"><div class="field"><label>Latitude</label><input id="fuLat" type="number" step=".000001" value="${i.targetLat||''}"></div><div class="field"><label>Longitude</label><input id="fuLon" type="number" step=".000001" value="${i.targetLon||''}"></div></div><div class="field"><label>Notes</label><textarea id="fuNotes"></textarea></div><button class="btn primary" id="fuSave" style="margin-top:10px">SAVE UPDATE</button>`,()=>{$('#fuSave').onclick=()=>{const u={id:uid('field'),incidentId:i.id,timestamp:now(),type:$('#fuType').value,lat:+$('#fuLat').value||null,lon:+$('#fuLon').value||null,notes:$('#fuNotes').value};state.fieldUpdates.push(u);if(u.type==='CORRECT LOCATION'&&u.lat&&u.lon){i.targetLat=u.lat;i.targetLon=u.lon;i.locationMethod='FIELD CREW';i.uncertaintyM=50}log('FIELD',`${u.type}: ${u.notes||i.title}`,i.id);save();closeModal();renderAll()}})}
const TYPE_CODE={OBS:1,UPDATE:2,BEARING:3,ACK:4,CLEAR:5,REQUEST:6,STATUS:7},OBS_CODE={UNKNOWN:0,SMOKE:1,FIRE:2,FLAME:3,LIGHTNING:4,'PRESCRIBED BURN':5,'STRUCTURE FIRE':6,'FALSE ALARM':7,CLEAR:8,OTHER:9},CONF_CODE={UNKNOWN:0,LOW:1,MODERATE:2,HIGH:3,CONFIRMED:4},URG_CODE={ROUTINE:0,IMPORTANT:1,EMERGENCY:2};const rev=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[v,k])),TR=rev(TYPE_CODE),OR=rev(OBS_CODE),CR=rev(CONF_CODE),UR=rev(URG_CODE);
function reportBytes(id){const c=String(id).replace(/[^A-Fa-f0-9]/g,'').padEnd(6,'0').slice(0,6);return[parseInt(c.slice(0,2),16)||0,parseInt(c.slice(2,4),16)||0,parseInt(c.slice(4,6),16)||0]} function bytesHex(bs){return Array.from(bs).map(b=>b.toString(16).padStart(2,'0')).join(' ').toUpperCase()} function hexBytes(h){return new Uint8Array(String(h).replace(/[^0-9a-f]/gi,'').match(/.{1,2}/g)?.map(x=>parseInt(x,16))||[])}
function encodeFWP(m){const buf=new ArrayBuffer(27),v=new DataView(buf);let o=0;v.setUint8(o++,1);v.setUint8(o++,TYPE_CODE[m.messageType]||0);reportBytes(m.reportId).forEach(b=>v.setUint8(o++,b));v.setUint8(o++,m.revision||1);v.setUint32(o,Math.floor(Date.now()/1000),false);o+=4;v.setInt32(o,Math.round((m.targetLat||0)*1e7),false);o+=4;v.setInt32(o,Math.round((m.targetLon||0)*1e7),false);o+=4;v.setUint16(o,Math.round((m.bearingDeg||0)*10),false);o+=2;const wireRange=m.messageType==='BEARING'&&m.bearingUncertaintyDeg!=null?Math.round(m.bearingUncertaintyDeg*100):Math.round(m.rangeM||0);v.setUint16(o,Math.min(65535,wireRange),false);o+=2;v.setUint8(o++,OBS_CODE[m.eventType||'UNKNOWN']||0);v.setUint8(o++,CONF_CODE[m.confidence||'UNKNOWN']||0);v.setUint8(o++,URG_CODE[m.urgency||'ROUTINE']||0);v.setUint16(o,0,false);const bytes=new Uint8Array(buf);return{bytes,hex:bytesHex(bytes)}}
function decodeFWP(bytes){if(bytes.length<27)throw new Error('FWP/1 must be 27 bytes');const v=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength);let o=0,version=v.getUint8(o++),messageType=TR[v.getUint8(o++)]||'OBS',reportId=[v.getUint8(o++),v.getUint8(o++),v.getUint8(o++)].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase(),revision=v.getUint8(o++),timestamp=new Date(v.getUint32(o,false)*1000).toISOString();o+=4;const targetLat=v.getInt32(o,false)/1e7;o+=4;const targetLon=v.getInt32(o,false)/1e7;o+=4;const bearingDeg=v.getUint16(o,false)/10;o+=2;const wireRange=v.getUint16(o,false);o+=2;const bearingUncertaintyDeg=messageType==='BEARING'?wireRange/100:null,rangeM=messageType==='BEARING'?0:wireRange;return{version,messageType,reportId,revision,timestamp,targetLat,targetLon,bearingDeg,bearingUncertaintyDeg,rangeM,eventType:OR[v.getUint8(o++)]||'UNKNOWN',confidence:CR[v.getUint8(o++)]||'UNKNOWN',urgency:UR[v.getUint8(o++)]||'ROUTINE',flags:v.getUint16(o,false)}}
function simulateFwp(type,i,b){const m={messageType:type,reportId:i.reportId,bearingDeg:b?.bearingDeg||0,rangeM:0,eventType:'SMOKE',confidence:i.confidence,urgency:i.urgency,targetLat:i.targetLat,targetLon:i.targetLon},e=encodeFWP(m);state.meshMessages.push({id:uid('mesh'),timestamp:now(),...m,transport:'SIMULATED',payloadBytes:27,payloadHex:e.hex})}
function renderAll(){document.documentElement.dataset.theme=state.settings.theme==='light'?'light':'';document.documentElement.dataset.fieldSize=state.settings.fieldSize?'1':'0';$('#roleBadge').textContent=state.settings.role||'LOOKOUT';renderView(state.settings.view||'watch')}function renderView(v){if(v==='watch')renderWatch();if(v==='map')renderMap();if(v==='incidents')renderIncidents();if(v==='log')renderLog();if(v==='tower')renderTower();if(v==='network')renderNetwork()}
function ascii(s){return String(s).normalize('NFKD').replace(/°/g,' deg').replace(/±/g,'+/-').replace(/[–—]/g,'-').replace(/[^\x20-\x7E\n]/g,'?')} function pdfEsc(s){return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')} function wrapLine(line,width=90){if(line.length<=width)return[line];let out=[],r=line;while(r.length>width){let c=r.lastIndexOf(' ',width);if(c<20)c=width;out.push(r.slice(0,c));r=r.slice(c).trimStart()}if(r)out.push(r);return out}
function pdfBlob(title,text){const raw=[title,'',...text.split('\n')].flatMap(x=>wrapLine(ascii(x))),pp=52,pages=[];for(let i=0;i<raw.length;i+=pp)pages.push(raw.slice(i,i+pp));if(!pages.length)pages.push([]);const ob=[],font=3,ps=4,cs=ps+pages.length;ob[1]='<< /Type /Catalog /Pages 2 0 R >>';ob[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>`${ps+i} 0 R`).join(' ')}] /Count ${pages.length} >>`;ob[font]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>';pages.forEach((lines,i)=>{const po=ps+i,co=cs+i;ob[po]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${co} 0 R >>`;let y=752,cmd=['BT','/F1 10 Tf'];for(const l of lines){cmd.push(`1 0 0 1 42 ${y} Tm (${pdfEsc(l)}) Tj`);y-=13}cmd.push('ET');const st=cmd.join('\n');ob[co]=`<< /Length ${st.length} >>\nstream\n${st}\nendstream`});let pdf='%PDF-1.4\n',offs=[0],count=cs+pages.length-1;for(let i=1;i<=count;i++){offs[i]=pdf.length;pdf+=`${i} 0 obj\n${ob[i]}\nendobj\n`}const xr=pdf.length;pdf+=`xref\n0 ${count+1}\n0000000000 65535 f \n`;for(let i=1;i<=count;i++)pdf+=`${String(offs[i]).padStart(10,'0')} 00000 n \n`;pdf+=`trailer\n<< /Size ${count+1} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`;return new Blob([pdf],{type:'application/pdf'})}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function downloadIncidentPdf(i){const bs=state.bearings.filter(b=>b.incidentId===i.id),obs=state.observations.filter(o=>o.incidentId===i.id),logs=state.logs.filter(l=>l.incidentId===i.id),text=[`Report: ${i.reportId}`,`Status: ${i.status}`,`Location: ${i.targetLat||'—'}, ${i.targetLon||'—'} (${i.locationMethod||'UNKNOWN'}, +/-${Math.round(i.uncertaintyM||0)} m)`,`Geometry: ${i.geometryQuality||'—'} RMS ${Number(i.rmsResidualDeg||0).toFixed(2)} deg`,'','OBSERVATIONS',...obs.map(o=>`${fmt(o.createdAt)} ${o.type} ${o.bearingDeg.toFixed(1)} deg ${o.confidence} ${o.notes||''}`),'','BEARINGS',...bs.map(b=>`${state.towers.find(t=>t.id===b.towerId)?.name||b.towerId}: ${b.bearingDeg.toFixed(1)} deg +/-${b.uncertaintyDeg}`),'','TIMELINE',...logs.map(l=>`${fmt(l.timestamp)} ${l.kind}: ${l.message}`)].join('\n');download(pdfBlob(`FIREWATCH Incident ${i.reportId}`,text),`FIREWATCH-Incident-${i.reportId}.pdf`)}
function downloadShiftPdf(){const wx=latestWeather(),active=state.incidents.filter(i=>i.status!=='CLOSED'),text=[`Tower: ${tower().name}`,`Operator: ${state.shift.operatorName}`,`Shift started: ${fmt(state.shift.startedAt)}`,`Latest weather: ${wx?`${wx.temperatureF} F, RH ${wx.rh}%, wind ${wx.windDir} ${wx.windMph} mph, visibility ${wx.visibilityMi} mi (${wx.source})`:'none'}`,'',`ACTIVE INCIDENTS: ${active.length}`,...active.map(i=>`${i.reportId} ${i.title} ${i.status}`),'',`OPEN RECHECKS: ${state.watchItems.filter(w=>w.status==='OPEN').length}`,...state.watchItems.filter(w=>w.status==='OPEN').map(w=>`${w.priority} ${w.title}: ${w.reason}`),'','HANDOFF',state.shift.handoffNotes||'','',...state.logs.slice(0,80).reverse().map(l=>`${fmt(l.timestamp)} ${l.kind}: ${l.message}`)].join('\n');download(pdfBlob('FIREWATCH Shift / Handoff Report',text),`FIREWATCH-Shift-${new Date().toISOString().slice(0,10)}.pdf`)}
$$('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#globalFreshBtn').onclick=startFresh;$('#fieldSizeBtn').onclick=()=>{state.settings.fieldSize=!state.settings.fieldSize;save();renderAll()};$('#themeBtn').onclick=()=>{state.settings.theme=state.settings.theme==='light'?'dark':'light';save();renderAll()};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key.toLowerCase()==='n')openSighting();if(e.key.toLowerCase()==='m')setView('map');if(e.key.toLowerCase()==='l')setView('log');if(e.key==='Escape')closeModal()});
